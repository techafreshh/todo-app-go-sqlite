<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f4;
      --card: #ffffff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #2563eb;
      --danger: #b91c1c;
      --on-accent: #ffffff;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --badge-low-bg: #e0f2fe;
      --badge-low-ink: #075985;
      --badge-medium-bg: #fef3c7;
      --badge-medium-ink: #92400e;
      --badge-high-bg: #fee2e2;
      --badge-high-ink: #991b1b;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1917;
      --card: #292524;
      --ink: #e7e5e4;
      --muted: #a8a29e;
      --line: #78716c;
      --accent: #60a5fa;
      --danger: #f87171;
      --on-accent: #1c1917;
      --error-bg: #450a0a;
      --error-border: #7f1d1d;
      --badge-low-bg: #0c4a6e;
      --badge-low-ink: #bae6fd;
      --badge-medium-bg: #78350f;
      --badge-medium-ink: #fde68a;
      --badge-high-bg: #7f1d1d;
      --badge-high-ink: #fecaca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      padding: 1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .field-title { flex: 1 1 12rem; }
    .field-priority { flex: 0 1 7rem; }
    .field-due { flex: 0 1 9rem; }
    input, select, button {
      font: inherit;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 0.375rem;
      background: var(--card);
      color: var(--ink);
    }
    input, select { width: 100%; }
    button {
      flex: 0 0 auto;
      border-color: var(--accent);
      background: var(--accent);
      color: var(--on-accent);
      cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .validation, .error {
      flex-basis: 100%;
      margin: 0;
      font-size: 0.85rem;
    }
    .validation { color: var(--danger); }
    .error {
      padding: 0.6rem 0.75rem;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 0.375rem;
      color: var(--danger);
    }
    ul.todos {
      list-style: none;
      margin: 1rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    li.todo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 0.75rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
    }
    .todo-title { flex: 1 1 auto; overflow-wrap: anywhere; }
    li.todo.done .todo-title { text-decoration: line-through; color: var(--muted); }
    .todo-toggle {
      flex: 0 0 auto;
      width: 1.1rem;
      height: 1.1rem;
      padding: 0;
      accent-color: var(--accent);
    }
    .todo-delete {
      flex: 0 0 auto;
      padding: 0.3rem 0.6rem;
      border-color: var(--line);
      background: transparent;
      color: var(--danger);
    }
    .todo-delete:hover { border-color: var(--danger); filter: none; }
    .badge, .due-overdue, .due-today {
      flex: 0 0 auto;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-low { background: var(--badge-low-bg); color: var(--badge-low-ink); }
    .badge-medium { background: var(--badge-medium-bg); color: var(--badge-medium-ink); }
    .badge-high { background: var(--badge-high-bg); color: var(--badge-high-ink); }
    .due { flex: 0 0 auto; font-size: 0.8rem; color: var(--muted); }
    .due-overdue { background: var(--badge-high-bg); color: var(--badge-high-ink); }
    .due-today { background: var(--badge-medium-bg); color: var(--badge-medium-ink); }
    .todo-edit {
      flex: 0 0 auto;
      padding: 0.3rem 0.6rem;
      border-color: var(--line);
      background: transparent;
      color: var(--accent);
    }
    .todo-edit:hover { border-color: var(--accent); filter: none; }
    .todo-edit-title { flex: 1 1 8rem; min-width: 0; }
    .todo-edit-priority { flex: 0 1 7rem; min-width: 0; }
    .todo-edit-due { flex: 0 1 9rem; min-width: 0; }
    .todo-edit-save, .todo-edit-cancel {
      flex: 0 0 auto;
      padding: 0.3rem 0.6rem;
    }
    .todo-edit-save {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--on-accent);
    }
    .todo-edit-cancel {
      border-color: var(--line);
      background: transparent;
      color: var(--ink);
    }
    .todo-edit-cancel:hover { filter: none; background: var(--bg); }
    .empty {
      margin: 1rem 0 0;
      padding: 1rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 0.5rem;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-top: 1rem;
      padding: 1rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
    }
    .field-search { flex: 1 1 12rem; }
    .field-filter-priority { flex: 0 1 7rem; }
    .field-sort { flex: 0 1 9rem; }
    .segmented {
      display: flex;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 0.375rem;
      overflow: hidden;
    }
    .segment {
      border: 0;
      border-radius: 0;
      background: var(--card);
      color: var(--ink);
    }
    .segment + .segment { border-left: 1px solid var(--line); }
    .segment:hover { filter: none; background: var(--bg); }
    .segment.active,
    .segment.active:hover {
      background: var(--accent);
      color: var(--on-accent);
    }
    .theme-toggle {
      flex: 0 0 auto;
      padding: 0.3rem 0.6rem;
      border-color: var(--muted);
      background: transparent;
      color: var(--ink);
    }
    .theme-toggle:hover { border-color: var(--ink); filter: none; }
  </style>
  <script>
    // Resolves the theme before first paint: a stored choice wins; otherwise
    // the OS preference decides, and light is the fallback. The attribute must
    // be set here, not in the body script, or an explicit light choice over a
    // dark OS would flash dark.
    (function () {
      var theme = null;
      try {
        theme = localStorage.getItem("todo-theme");
      } catch (err) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <main>
    <header class="site-header">
      <h1>Todo</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Dark</button>
    </header>

    <p id="error" class="error" role="alert" hidden></p>

    <form id="add-form" novalidate>
      <label class="field field-title">
        <span>Title</span>
        <input id="title" name="title" type="text" maxlength="255" required
               autocomplete="off" placeholder="What needs doing?">
      </label>

      <label class="field field-priority">
        <span>Priority</span>
        <select id="priority" name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <label class="field field-due">
        <span>Due date</span>
        <input id="due-date" name="due_date" type="date">
      </label>

      <button type="submit">Add</button>

      <p id="validation" class="validation" role="alert" hidden></p>
    </form>

    <div class="filters">
      <div class="segmented" role="group" aria-label="Status">
        <button type="button" class="segment active" data-status="all" aria-pressed="true">All</button>
        <button type="button" class="segment" data-status="active" aria-pressed="false">Active</button>
        <button type="button" class="segment" data-status="done" aria-pressed="false">Done</button>
      </div>

      <label class="field field-search">
        <span>Search</span>
        <input id="search" type="search" autocomplete="off" placeholder="Search titles">
      </label>

      <label class="field field-filter-priority">
        <span>Priority</span>
        <select id="filter-priority">
          <option value="">Any</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <label class="field field-sort">
        <span>Sort</span>
        <select id="sort">
          <option value="created" selected>Created</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </label>
    </div>

    <ul id="todos" class="todos"></ul>
    <p id="empty" class="empty" hidden>No todos yet.</p>
  </main>

  <script>
    (function () {
      "use strict";

      var form = document.getElementById("add-form");
      var titleInput = document.getElementById("title");
      var prioritySelect = document.getElementById("priority");
      var dueInput = document.getElementById("due-date");
      var list = document.getElementById("todos");
      var empty = document.getElementById("empty");
      var errorBanner = document.getElementById("error");
      var validation = document.getElementById("validation");
      var statusButtons = document.querySelectorAll(".segment");
      var searchInput = document.getElementById("search");
      var filterPrioritySelect = document.getElementById("filter-priority");
      var sortSelect = document.getElementById("sort");
      var themeToggle = document.getElementById("theme-toggle");

      var SEARCH_DEBOUNCE_MS = 200;

      // Client filter state maps one-to-one to the list API's query parameters;
      // listURL sends only the values that differ from the API defaults.
      var filters = {
        status: "all",
        q: "",
        priority: "",
        sort: "created"
      };

      var errorSource = null;

      // The banner is shared by every flow; only the flow that set it may clear
      // it, so one operation's success never erases another's failure.
      function showError(source, message) {
        errorSource = source;
        errorBanner.textContent = message;
        errorBanner.hidden = false;
      }

      function clearError(source) {
        if (errorSource !== source) {
          return;
        }
        errorSource = null;
        errorBanner.hidden = true;
        errorBanner.textContent = "";
      }

      function showValidation(message) {
        validation.textContent = message;
        validation.hidden = false;
      }

      function clearValidation() {
        validation.hidden = true;
        validation.textContent = "";
      }

      // A non-2xx response carries the server's {"error": ...} envelope; surface
      // it as a rejected promise so every mutation flow shares one failure path.
      function ensureOk(resp, fallback) {
        if (resp.ok) {
          return Promise.resolve(resp);
        }
        return resp.json().catch(function () {
          return {};
        }).then(function (body) {
          throw new Error(body.error || fallback);
        });
      }

      // A row's controls stay disabled while its mutation is in flight, so a
      // second activation cannot race the first response into the DOM.
      function setRowBusy(item, busy) {
        var controls = item.querySelectorAll(
          ".todo-toggle, .todo-edit, .todo-delete, .todo-edit-save, .todo-edit-cancel"
        );
        for (var i = 0; i < controls.length; i++) {
          controls[i].disabled = busy;
        }
      }

      // The stored due date is a local calendar day, so build today's from the
      // local clock; toISOString would read it in UTC and shift the day.
      function todayISO() {
        var now = new Date();
        var month = String(now.getMonth() + 1).padStart(2, "0");
        var day = String(now.getDate()).padStart(2, "0");
        return now.getFullYear() + "-" + month + "-" + day;
      }

      function renderTodo(todo) {
        var item = document.createElement("li");
        item.className = "todo" + (todo.done ? " done" : "");

        var checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "todo-toggle";
        checkbox.checked = todo.done;
        checkbox.setAttribute("aria-label", "Mark done");
        checkbox.addEventListener("change", function () {
          toggleTodo(todo, item, checkbox);
        });
        item.appendChild(checkbox);

        var title = document.createElement("span");
        title.className = "todo-title";
        title.textContent = todo.title;
        item.appendChild(title);

        var badge = document.createElement("span");
        badge.className = "badge badge-" + todo.priority;
        badge.textContent = todo.priority;
        item.appendChild(badge);

        if (todo.due_date) {
          var today = todayISO();
          var due = document.createElement("span");
          due.className = "due";
          if (!todo.done && todo.due_date < today) {
            due.className = "due-overdue";
            due.textContent = "Overdue";
          } else if (!todo.done && todo.due_date === today) {
            due.className = "due-today";
            due.textContent = "Today";
          } else {
            due.textContent = "Due " + todo.due_date;
          }
          item.appendChild(due);
        }

        var edit = document.createElement("button");
        edit.type = "button";
        edit.className = "todo-edit";
        edit.textContent = "Edit";
        edit.setAttribute("aria-label", "Edit " + todo.title);
        edit.addEventListener("click", function () {
          startEdit(todo, item);
        });
        item.appendChild(edit);

        var remove = document.createElement("button");
        remove.type = "button";
        remove.className = "todo-delete";
        remove.textContent = "Delete";
        remove.setAttribute("aria-label", "Delete " + todo.title);
        remove.addEventListener("click", function () {
          deleteTodo(todo, item);
        });
        item.appendChild(remove);

        return item;
      }

      // Swaps a row between its view and edit controls. The updated todo the
      // server returns rebuilds the view, so the row reflects persisted state
      // without refetching the whole filtered list.
      function replaceRow(todo, item) {
        item.replaceWith(renderTodo(todo));
      }

      function startEdit(todo, item) {
        var title = document.createElement("input");
        title.type = "text";
        title.className = "todo-edit-title";
        title.maxLength = 255;
        title.value = todo.title;
        title.setAttribute("aria-label", "Edit title");

        // Mirror the add form's priority options so the two selects cannot
        // drift; that list is the one the conformance test binds to the server.
        var priority = document.createElement("select");
        priority.className = "todo-edit-priority";
        priority.setAttribute("aria-label", "Edit priority");
        for (var p = 0; p < prioritySelect.options.length; p++) {
          var source = prioritySelect.options[p];
          var option = document.createElement("option");
          option.value = source.value;
          option.textContent = source.textContent;
          option.selected = source.value === todo.priority;
          priority.appendChild(option);
        }

        var due = document.createElement("input");
        due.type = "date";
        due.className = "todo-edit-due";
        due.value = todo.due_date || "";
        due.setAttribute("aria-label", "Edit due date");

        var save = document.createElement("button");
        save.type = "button";
        save.className = "todo-edit-save";
        save.textContent = "Save";
        save.addEventListener("click", function () {
          saveEdit(todo, item, title, priority, due);
        });

        var cancel = document.createElement("button");
        cancel.type = "button";
        cancel.className = "todo-edit-cancel";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", function () {
          replaceRow(todo, item);
        });

        item.replaceChildren(title, priority, due, save, cancel);
        title.focus();
      }

      function saveEdit(todo, item, titleInput, priorityInput, dueInput) {
        var source = "edit:" + todo.id;
        var title = titleInput.value.trim();
        if (title === "") {
          showError(source, "Enter a title before saving.");
          titleInput.focus();
          return;
        }

        var payload = {
          title: title,
          priority: priorityInput.value,
          done: todo.done
        };
        if (dueInput.value) {
          payload.due_date = dueInput.value;
        }

        setRowBusy(item, true);
        fetch("/api/todos/" + todo.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(function (resp) {
            return ensureOk(resp, "Could not save todo.");
          })
          .then(function (resp) {
            return resp.json();
          })
          .then(function (updated) {
            clearError(source);
            // An edit can change a filter-keyed field (title, priority) or a
            // sort-keyed one (priority, due date), so reload the list instead
            // of swapping the row in place, which would leave it at its stale
            // index under a non-default sort.
            if (filtersActive() || filters.sort !== "created") {
              return loadTodos();
            }
            replaceRow(updated, item);
          })
          .catch(function (err) {
            showError(source, err.message || "Could not save todo.");
          })
          .finally(function () {
            setRowBusy(item, false);
          });
      }

      function toggleTodo(todo, item, checkbox) {
        var source = "toggle:" + todo.id;
        setRowBusy(item, true);
        fetch("/api/todos/" + todo.id + "/toggle", { method: "PATCH" })
          .then(function (resp) {
            return ensureOk(resp, "Could not update todo.");
          })
          .then(function () {
            clearError(source);
            // A toggle can move the row out of the active status filter, so
            // reload the filtered list instead of mutating the row in place.
            // Returning it keeps the row busy until the reconciled list renders,
            // so an edit cannot read this row's pre-toggle done.
            return loadTodos();
          })
          .catch(function (err) {
            checkbox.checked = todo.done;
            showError(source, err.message || "Could not update todo.");
          })
          .finally(function () {
            setRowBusy(item, false);
          });
      }

      function deleteTodo(todo, item) {
        var source = "delete:" + todo.id;
        setRowBusy(item, true);
        fetch("/api/todos/" + todo.id, { method: "DELETE" })
          .then(function (resp) {
            // DELETE is idempotent: a 404 means the row is already gone.
            if (resp.status === 404) {
              return;
            }
            return ensureOk(resp, "Could not delete todo.");
          })
          .then(function () {
            clearError(source);
            item.remove();
            syncEmptyState();
          })
          .catch(function (err) {
            showError(source, err.message || "Could not delete todo.");
          })
          .finally(function () {
            if (item.isConnected) {
              setRowBusy(item, false);
            }
          });
      }

      function render(todos) {
        list.replaceChildren();
        todos.forEach(function (todo) {
          list.appendChild(renderTodo(todo));
        });
        syncEmptyState();
      }

      function filtersActive() {
        return filters.status !== "all" || filters.priority !== "" || filters.q !== "";
      }

      // The empty list has two meanings: nothing exists yet, or the active
      // filter matched nothing. PRD §7 names the second "No todos match".
      function syncEmptyState() {
        if (list.children.length > 0) {
          empty.hidden = true;
          return;
        }
        empty.textContent = filtersActive() ? "No todos match" : "No todos yet.";
        empty.hidden = false;
      }

      // Only non-default values are sent, so an untouched filter bar requests
      // the bare list and each control "adds" exactly its own parameter.
      function listURL() {
        var params = new URLSearchParams();
        if (filters.status !== "all") {
          params.set("status", filters.status);
        }
        if (filters.q !== "") {
          params.set("q", filters.q);
        }
        if (filters.priority !== "") {
          params.set("priority", filters.priority);
        }
        if (filters.sort !== "created") {
          params.set("sort", filters.sort);
        }
        var query = params.toString();
        return query === "" ? "/api/todos" : "/api/todos?" + query;
      }

      function loadTodos() {
        return fetch(listURL())
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error("HTTP " + resp.status);
            }
            return resp.json();
          })
          .then(function (todos) {
            clearError("load");
            render(todos);
          })
          .catch(function () {
            showError("load", "Could not load todos. Check that the server is running.");
          });
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var title = titleInput.value.trim();
        if (title === "") {
          showValidation("Enter a title before adding a todo.");
          titleInput.focus();
          return;
        }
        clearValidation();

        var payload = { title: title, priority: prioritySelect.value };
        if (dueInput.value) {
          payload.due_date = dueInput.value;
        }

        fetch("/api/todos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(function (resp) {
            return ensureOk(resp, "Could not add todo.");
          })
          .then(function (resp) {
            return resp.json();
          })
          .then(function () {
            clearError("create");
            form.reset();
            titleInput.focus();
            loadTodos();
          })
          .catch(function (err) {
            showError("create", err.message || "Could not add todo.");
          });
      });

      function setStatus(status) {
        filters.status = status;
        for (var i = 0; i < statusButtons.length; i++) {
          var isActive = statusButtons[i].getAttribute("data-status") === status;
          statusButtons[i].classList.toggle("active", isActive);
          statusButtons[i].setAttribute("aria-pressed", isActive ? "true" : "false");
        }
      }

      for (var b = 0; b < statusButtons.length; b++) {
        statusButtons[b].addEventListener("click", function (event) {
          setStatus(event.currentTarget.getAttribute("data-status"));
          loadTodos();
        });
      }

      filterPrioritySelect.addEventListener("change", function () {
        filters.priority = filterPrioritySelect.value;
        loadTodos();
      });

      sortSelect.addEventListener("change", function () {
        filters.sort = sortSelect.value;
        loadTodos();
      });

      // Typing fires one request per pause, not one per keystroke (PRD §7).
      var searchTimer = null;
      searchInput.addEventListener("input", function () {
        if (searchTimer !== null) {
          clearTimeout(searchTimer);
        }
        searchTimer = setTimeout(function () {
          searchTimer = null;
          filters.q = searchInput.value.trim();
          loadTodos();
        }, SEARCH_DEBOUNCE_MS);
      });

      // The head script has already resolved the theme, so the active one is
      // always readable off data-theme; a click stores the flipped value as an
      // explicit choice, which then overrides the OS preference on reload.
      function activeTheme() {
        return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }

      function syncThemeToggle() {
        themeToggle.setAttribute("aria-pressed", activeTheme() === "dark" ? "true" : "false");
      }

      themeToggle.addEventListener("click", function () {
        var next = activeTheme() === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        try {
          localStorage.setItem("todo-theme", next);
        } catch (err) {}
        syncThemeToggle();
      });

      syncThemeToggle();

      loadTodos();
    })();
  </script>
</body>
</html>
